name: release

# On a version tag: lint and test the tooling, package the kit with
# scripts/package.sh, and publish the packaged files as release assets.
# The packaged kit is published, never committed.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/*.sh tools/*.sh

  test:
    # macOS ships Bash 3.2 as /bin/bash, the oldest shell the tools support.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the shell under test
        if: matrix.shell == '/bin/bash'
        run: |
          /bin/bash -c '[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2 ]' \
            || { echo "::error::/bin/bash is not Bash 3.2 on this runner"; exit 1; }
      - name: Run the tests
        env:
          VERDICT_BASH: ${{ matrix.shell }}
        run: |
          status=0
          while IFS= read -r t; do
            echo "::group::$t"
            "$VERDICT_BASH" "$t" || status=1
            echo "::endgroup::"
          done < <(find . -name '*_test.sh' -not -path './.git/*' | sort)
          exit "$status"

  release:
    needs: [shellcheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package the kit
        run: scripts/package.sh --tag "$GITHUB_REF_NAME" dist
      - name: Check the package
        working-directory: dist
        run: |
          sha256sum -c MANIFEST
          if ls | grep -q '_test\.sh$'; then
            echo "::error::a test file was packaged"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
