name: release

# On a version tag, or when run by hand from the Actions tab: lint and test
# the tooling, package the kit with scripts/package.sh into
# breadcrumb-kit-<version>.zip, and publish that zip as the release asset.
# The packaged kit is published, never committed.
#
# A manual run releases the commit it runs on, under the tag v<version> read
# from tools/VERSION. If that tag exists, it must point to the same commit.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck scripts/*.sh tools/*.sh

  test:
    # macOS ships Bash 3.2 as /bin/bash, the oldest shell the tools support.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the shell under test
        if: matrix.shell == '/bin/bash'
        run: |
          /bin/bash -c '[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2 ]' \
            || { echo "::error::/bin/bash is not Bash 3.2 on this runner"; exit 1; }
      - name: Run the tests
        env:
          VERDICT_BASH: ${{ matrix.shell }}
        run: |
          status=0
          while IFS= read -r t; do
            echo "::group::$t"
            "$VERDICT_BASH" "$t" || status=1
            echo "::endgroup::"
          done < <(find . -name '*_test.sh' -not -path './.git/*' | sort)
          exit "$status"

  release:
    needs: [shellcheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$(cat tools/VERSION)"
            if commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              if [ "$commit" != "$GITHUB_SHA" ]; then
                echo "::error::tag $tag points to $commit, not to $GITHUB_SHA"
                exit 1
              fi
            fi
          else
            tag=$GITHUB_REF_NAME
          fi
          echo "TAG=$tag" >>"$GITHUB_ENV"
      - name: Package the kit
        run: scripts/package.sh --tag "$TAG" dist
      - name: Check the package
        run: |
          version=$(cat tools/VERSION)
          [ "$(ls dist)" = "breadcrumb-kit-$version.zip" ] \
            || { echo "::error::dist does not hold breadcrumb-kit-$version.zip alone"; exit 1; }
          mkdir unpacked
          unzip -q "dist/breadcrumb-kit-$version.zip" -d unpacked
          [ "$(ls -A unpacked)" = .breadcrumb-kit ] \
            || { echo "::error::the zip does not hold .breadcrumb-kit/ alone"; exit 1; }
          cd unpacked/.breadcrumb-kit || exit 1
          sha256sum -c MANIFEST
          [ "$(tail -n +3 breadcrumb-sdd.md | sha256sum)" = "$(sha256sum <"$GITHUB_WORKSPACE/breadcrumb-sdd.md")" ] \
            || { echo "::error::the packaged specification differs from its source"; exit 1; }
          if find . -name '*_test.sh' | grep -q .; then
            echo "::error::a test file was packaged"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
