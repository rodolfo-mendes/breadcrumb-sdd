# Runs bcr extract | bcr verify on every push, with the bcr built from
# the commit it checks (specs/extract, specs/verify).
name: Check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o "$RUNNER_TEMP/bcr" ./cmd/bcr

      - name: Verify breadcrumbs
        run: |
          set -o pipefail
          "$RUNNER_TEMP/bcr" extract | "$RUNNER_TEMP/bcr" verify
