# Runs go test ./..., then bcr extract | bcr verify | bcr audit |
# bcr report, on every push, with the bcr built from the commit it
# checks (specs/asdlc). A failing test, a problem or a Refuted claim
# fails the job. The log shows them, as they are on standard error; the
# page bcr report writes goes to the job's summary and is kept as an
# artifact of the run, whether the job fails or not.
name: Check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o "$RUNNER_TEMP/bcr" ./cmd/bcr

      - name: Verify, audit and report breadcrumbs
        run: |
          set -o pipefail
          "$RUNNER_TEMP/bcr" extract | "$RUNNER_TEMP/bcr" verify | "$RUNNER_TEMP/bcr" audit | "$RUNNER_TEMP/bcr" report > "$RUNNER_TEMP/report.md"

      - name: Show the report
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/report.md" ]; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/report.md
          archive: false
          if-no-files-found: ignore
